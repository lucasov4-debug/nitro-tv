name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk nitro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-apk
          path: nitro.apk

      # Link fixo para baixar direto na TV (app Downloader):
      # https://github.com/<usuario>/<repo>/releases/download/latest/nitro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nitro (última versão)
          files: nitro.apk
