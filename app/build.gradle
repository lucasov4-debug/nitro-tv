plugins {
    id 'com.android.application'
}

android {
    namespace 'app.nitro.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.nitro.tv'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file('nitro.keystore')
            storePassword 'nitro123'
            keyAlias 'nitro'
            keyPassword 'nitro123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
